<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Trail Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .grid-container {
            display: grid;
            /* Smaller boxes: 20px each */
            grid-template-columns: repeat(auto-fill, minmax(20px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(20px, 1fr));
            width: 100vw;
            height: 100vh;
        }

        .grid-item {
            width: 100%;
            height: 100%;
            background-color: transparent;
            /* The 2-second fade away */
            transition: background-color 2s ease, box-shadow 2s ease;
        }

        /* Random Background Twinkle */
        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.2; background-color: #9d50bb; }
        }

        .twinkle-active::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            animation: twinkle 5s infinite;
        }

        /* The Cursor Glow State */
        .grid-item.active {
            background-color: #00d2ff;
            background-image: linear-gradient(135deg, #00d2ff, #9d50bb);
            box-shadow: 0 0 15px #00d2ff, 0 0 30px #9d50bb;
            transition: 0s; /* Instant color on touch */
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="grid-container" id="grid"></div>

    <script>
        const container = document.getElementById('grid');
        const squareSize = 20; // Size of each box
        
        const cols = Math.ceil(window.innerWidth / squareSize);
        const rows = Math.ceil(window.innerHeight / squareSize);
        const total = cols * rows;

        const items = [];

        // Create Grid
        for (let i = 0; i < total; i++) {
            const item = document.createElement('div');
            item.classList.add('grid-item');
            
            // Randomly assign twinkle to some boxes
            if (Math.random() > 0.95) {
                item.classList.add('twinkle-active');
                item.style.animationDelay = `${Math.random() * 5}s`;
            }

            container.appendChild(item);
            items.push(item);
        }

        function handleMove(e) {
            const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);

            // Radius in pixels (approx 2-3 boxes)
            const radius = 50; 

            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                const itemX = rect.left + rect.width / 2;
                const itemY = rect.top + rect.height / 2;

                const distance = Math.sqrt((x - itemX) ** 2 + (y - itemY) ** 2);

                if (distance < radius) {
                    item.classList.add('active');
                    
                    // Remove class quickly so the CSS transition handles the fade
                    setTimeout(() => {
                        item.classList.remove('active');
                    }, 100);
                }
            });
        }

        // Listeners for both Mouse and Touch
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => {
            handleMove(e);
        }, { passive: false });

    </script>
</body>
</html>
