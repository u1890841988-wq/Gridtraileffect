<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma Trail - Clean Gold Edition</title>
    <style>
        :root {
            --bg-color: #0e0d0a;
            --gold: #fcd55b;
            --glow: rgba(252, 213, 91, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Full screen grid container */
        .prisma-grid {
            display: grid;
            /* Dense grid for a smooth trail */
            grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(30px, 1fr));
            width: 100vw;
            height: 100vh;
            position: absolute;
        }

        .grid-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Prisma Line */
        .line {
            width: 2px;
            height: 15px;
            background-color: var(--gold);
            border-radius: 2px;
            opacity: 0;
            /* 2 second fade out as requested */
            transition: opacity 2s ease, transform 2s ease, background-color 2s ease;
            will-change: transform, opacity;
        }

        /* Active state when cursor is near */
        .line.active {
            opacity: 1;
            box-shadow: 0 0 12px var(--glow);
            /* Instant appearance */
            transition: none; 
        }
    </style>
</head>
<body>

    <div class="prisma-grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        const squareSize = 30;
        const cols = Math.ceil(window.innerWidth / squareSize);
        const rows = Math.ceil(window.innerHeight / squareSize);
        const total = cols * rows;
        const items = [];

        // Initialize Grid
        for (let i = 0; i < total; i++) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('grid-item');
            
            const line = document.createElement('div');
            line.classList.add('line');
            
            // Give each line a unique random length for the "Random" look
            const randomHeight = 10 + Math.random() * 20;
            line.style.height = `${randomHeight}px`;

            wrapper.appendChild(line);
            grid.appendChild(wrapper);
            
            // Store coordinates for performance
            items.push({ 
                element: line, 
                wrapper: wrapper,
                x: 0, 
                y: 0 
            });
        }

        // Cache positions once to avoid layout thrashing
        function updateLayout() {
            items.forEach(item => {
                const rect = item.wrapper.getBoundingClientRect();
                item.x = rect.left + rect.width / 2;
                item.y = rect.top + rect.height / 2;
            });
        }
        window.addEventListener('resize', updateLayout);
        updateLayout();

        function handleMove(e) {
            const mouseX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const mouseY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

            const radius = 80; // Radius of the Prisma effect

            items.forEach(item => {
                const dx = mouseX - item.x;
                const dy = mouseY - item.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < radius) {
                    // Calculate angle so lines point toward cursor
                    const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    
                    item.element.style.transform = `rotate(${angle + 90}deg) scaleY(1.5)`;
                    item.element.classList.add('active');

                    // Brief timeout to allow the class to be removed for the fade transition
                    setTimeout(() => {
                        item.element.classList.remove('active');
                        item.element.style.transform = `rotate(${angle + 90}deg) scaleY(1)`;
                    }, 50);
                }
            });
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleMove(e);
        }, { passive: false });
    </script>
</body>
</html>
