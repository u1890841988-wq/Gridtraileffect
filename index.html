<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numecraft Trail</title>
    <style>
        :root {
            --bg-top: #0e0d0a;
            --bg-bottom: #1c180e;
            --gold: #fcd55b;
            --glow: rgba(252, 213, 91, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            cursor: none; /* Hide cursor to emphasize the glow card effect */
        }

        /* The Framer-style Glow Card Cursor */
        #glow-cursor {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(25px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(25px, 1fr));
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .grid-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The "Line" inside each cell */
        .line {
            width: var(--line-width, 2px);
            height: var(--line-length, 0px);
            background-color: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            border-radius: 10px;
            transform: rotate(var(--random-rotate));
            transition: height 0.1s ease, background-color 2s ease, box-shadow 2s ease, opacity 2s ease;
            opacity: 0;
        }

        .line.active {
            opacity: 1;
            height: var(--line-length);
            transition: none; /* Instant grow on touch */
        }
    </style>
</head>
<body>

    <div id="glow-cursor"></div>
    <div class="grid-container" id="grid"></div>

    <script>
        const container = document.getElementById('grid');
        const glowCursor = document.getElementById('glow-cursor');
        const squareSize = 25;
        
        const cols = Math.ceil(window.innerWidth / squareSize);
        const rows = Math.ceil(window.innerHeight / squareSize);
        const total = cols * rows;

        const items = [];

        for (let i = 0; i < total; i++) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('grid-item');
            
            const line = document.createElement('div');
            line.classList.add('line');
            
            // Randomize line properties
            const randomRotate = Math.floor(Math.random() * 360);
            const randomLength = 10 + Math.random() * 25;
            const randomWidth = 1 + Math.random() * 2;
            
            line.style.setProperty('--random-rotate', `${randomRotate}deg`);
            line.style.setProperty('--line-length', `${randomLength}px`);
            line.style.setProperty('--line-width', `${randomWidth}px`);

            wrapper.appendChild(line);
            container.appendChild(wrapper);
            items.push({ wrapper, line });
        }

        function handleMove(e) {
            const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);

            // Update Framer-style Glow Cursor
            glowCursor.style.opacity = "1";
            glowCursor.style.left = `${x}px`;
            glowCursor.style.top = `${y}px`;

            const radius = 60; 

            items.forEach(item => {
                const rect = item.wrapper.getBoundingClientRect();
                const itemX = rect.left + rect.width / 2;
                const itemY = rect.top + rect.height / 2;

                const distance = Math.sqrt((x - itemX) ** 2 + (y - itemY) ** 2);

                if (distance < radius) {
                    item.line.classList.add('active');
                    
                    setTimeout(() => {
                        item.line.classList.remove('active');
                    }, 150);
                }
            });
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchstart', () => glowCursor.style.opacity = "1");
        window.addEventListener('touchmove', (e) => {
            handleMove(e);
        }, { passive: false });

        // Fade out glow card when mouse leaves
        window.addEventListener('mouseout', () => glowCursor.style.opacity = "0");
    </script>
</body>
</html>
