<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numecraft Components</title>
    <style>
        :root {
            --bg-color: rgb(14, 13, 10);
            --gold: rgb(252, 213, 91);
            --gold-dark: rgb(209, 184, 122);
            --glow: rgba(252, 213, 91, 0.3);
            --nav-bg: rgba(26, 24, 18, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: rgb(255, 255, 255);
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* NAVIGATION BAR with SVG Underlink */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 40px;
            border: 1px solid rgba(252, 213, 91, 0.2);
            display: flex;
            gap: 30px;
            z-index: 100;
        }

        .nav-link {
            position: relative;
            color: var(--gold-dark);
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding-bottom: 5px;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .nav-link.active-tab {
            color: var(--gold);
        }

        .svg-underline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            pointer-events: none;
        }

        .svg-underline path {
            stroke: var(--gold);
            stroke-width: 4;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .nav-link:hover .svg-underline path, 
        .nav-link.active-tab .svg-underline path {
            stroke-dashoffset: 0;
        }

        /* SECTION MANAGEMENT */
        .component-section {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .component-section.active-section {
            display: flex;
        }

        /* GLOBAL CURSOR GLOW (Works across all sections) */
        .global-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* --- COMPONENT 1: PRISMA GRID --- */
        .prisma-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(40px, 1fr));
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .prisma-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Real 3D Prism Shape */
        .prism-shape {
            width: 12px;
            height: 35px;
            background: linear-gradient(135deg, rgb(255, 240, 150) 0%, rgb(209, 184, 122) 50%, rgb(150, 120, 60) 100%);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transform: rotate(var(--rot)) scale(0.5);
            opacity: 0;
            transition: opacity 2s ease, transform 2s ease, filter 2s ease;
        }

        .prism-shape.active {
            opacity: 1;
            transform: rotate(var(--rot)) scale(1.2);
            filter: drop-shadow(0 0 10px var(--gold));
            transition: none;
        }

        /* --- COMPONENT 2: GLOW CARDS --- */
        .cards-wrapper {
            display: flex;
            gap: 40px;
            z-index: 5;
        }

        .framer-card {
            width: 300px;
            height: 450px;
            background-color: rgba(20, 18, 15, 0.9);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .framer-card-content {
            z-index: 2;
            color: var(--gold-dark);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .framer-card::before {
            content: "";
            position: absolute;
            top: var(--y);
            left: var(--x);
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(252, 213, 91, 0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        .framer-card:hover::before {
            opacity: 1;
        }

        /* --- COMPONENT 3: RIPPLE GRID --- */
        .ripple-container {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 4px;
            width: 80vw;
            height: 80vh;
            z-index: 5;
        }

        .ripple-box {
            background-color: rgba(30, 28, 22, 0.5);
            border-radius: 4px;
            transition: background-color 0.8s ease, transform 0.8s ease;
            cursor: pointer;
        }

        .ripple-box.ripple-active {
            background-color: var(--gold);
            transform: scale(0.8);
            transition: background-color 0s, transform 0s;
        }

    </style>
</head>
<body>

    <nav class="nav-container">
        <a class="nav-link active-tab" data-target="section-prisma">
            Prisma Grid
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none">
                <path d="M 0 5 L 100 5"></path>
            </svg>
        </a>
        <a class="nav-link" data-target="section-cards">
            Glow Cards
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none">
                <path d="M 0 5 L 100 5"></path>
            </svg>
        </a>
        <a class="nav-link" data-target="section-ripple">
            Ripple Grid
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none">
                <path d="M 0 5 L 100 5"></path>
            </svg>
        </a>
    </nav>

    <div class="global-glow" id="main-glow"></div>

    <!-- Section 1 -->
    <div class="component-section active-section" id="section-prisma">
        <div class="prisma-container" id="prisma-grid"></div>
    </div>

    <!-- Section 2 -->
    <div class="component-section" id="section-cards">
        <div class="cards-wrapper">
            <div class="framer-card">
                <div class="framer-card-content">Card One</div>
            </div>
            <div class="framer-card">
                <div class="framer-card-content">Card Two</div>
            </div>
            <div class="framer-card">
                <div class="framer-card-content">Card Three</div>
            </div>
        </div>
    </div>

    <!-- Section 3 -->
    <div class="component-section" id="section-ripple">
        <div class="ripple-container" id="ripple-grid"></div>
    </div>

    <script>
        // GLOBAL GLOW TRACKING
        const mainGlow = document.querySelector('.global-glow');
        window.addEventListener('mousemove', (e) => {
            mainGlow.style.opacity = '1';
            mainGlow.style.left = e.clientX + 'px';
            mainGlow.style.top = e.clientY + 'px';
        });

        // NAVIGATION LOGIC
        const links = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('.component-section');

        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                links.forEach(l => l.classList.remove('active-tab'));
                sections.forEach(s => s.classList.remove('active-section'));

                link.classList.add('active-tab');
                const targetId = link.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active-section');
            });
        });

        // COMPONENT 1: PRISMA GRID
        const prismaGrid = document.getElementById('prisma-grid');
        const pSize = 40;
        const pCols = Math.ceil(window.innerWidth / pSize);
        const pRows = Math.ceil(window.innerHeight / pSize);
        const pTotal = pCols * pRows;
        const prisms = [];

        for (let i = 0; i < pTotal; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'prisma-wrapper';
            const shape = document.createElement('div');
            shape.className = 'prism-shape';
            shape.style.setProperty('--rot', (Math.random() * 360) + 'deg');
            
            wrap.appendChild(shape);
            prismaGrid.appendChild(wrap);
            prisms.push({ el: shape, wrap: wrap, x: 0, y: 0 });
        }

        function calculatePrismPositions() {
            prisms.forEach(p => {
                const rect = p.wrap.getBoundingClientRect();
                p.x = rect.left + rect.width / 2;
                p.y = rect.top + rect.height / 2;
            });
        }
        
        setTimeout(calculatePrismPositions, 100);
        window.addEventListener('resize', calculatePrismPositions);

        document.getElementById('section-prisma').addEventListener('mousemove', (e) => {
            const rad = 120;
            prisms.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < rad) {
                    const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    p.el.style.setProperty('--rot', (angle + 90) + 'deg');
                    p.el.classList.add('active');
                    
                    setTimeout(() => {
                        p.el.classList.remove('active');
                    }, 50);
                }
            });
        });

        // COMPONENT 2: GLOW CARDS
        const cards = document.querySelectorAll('.framer-card');
        cards.forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--x', x + 'px');
                card.style.setProperty('--y', y + 'px');
            });
        });

        // COMPONENT 3: RIPPLE GRID
        const rippleGrid = document.getElementById('ripple-grid');
        const rCols = 20;
        const rRows = 15;
        const rippleBoxes = [];

        for (let y = 0; y < rRows; y++) {
            for (let x = 0; x < rCols; x++) {
                const box = document.createElement('div');
                box.className = 'ripple-box';
                box.dataset.x = x;
                box.dataset.y = y;
                rippleGrid.appendChild(box);
                rippleBoxes.push({ el: box, x: x, y: y });
            }
        }

        rippleGrid.addEventListener('mousemove', (e) => {
            if (e.target.classList.contains('ripple-box')) {
                triggerRipple(parseInt(e.target.dataset.x), parseInt(e.target.dataset.y));
            }
        });

        function triggerRipple(originX, originY) {
            rippleBoxes.forEach(box => {
                const dist = Math.sqrt(Math.pow(box.x - originX, 2) + Math.pow(box.y - originY, 2));
                if (dist < 4) {
                    setTimeout(() => {
                        box.el.classList.add('ripple-active');
                        setTimeout(() => box.el.classList.remove('ripple-active'), 150);
                    }, dist * 40);
                }
            });
        }
    </script>
</body>
</html>
