<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Component Ideas</title>
    <style>
        :root {
            --bg-color: rgb(14, 13, 10);
            --gold: rgb(252, 213, 91);
            --gold-dark: rgb(209, 184, 122);
            --glow: rgba(252, 213, 91, 0.3);
            --nav-bg: rgba(26, 24, 18, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: rgb(255, 255, 255);
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Cinematic Noise Texture */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            z-index: 999;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* NAVIGATION BAR */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(252, 213, 91, 0.2);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }

        .nav-link {
            position: relative;
            color: var(--gold-dark);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .nav-link.active-tab {
            color: var(--gold);
        }

        .svg-underline {
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            pointer-events: none;
        }

        .svg-underline path {
            stroke: var(--gold);
            stroke-width: 4;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link:hover .svg-underline path, 
        .nav-link.active-tab .svg-underline path {
            stroke-dashoffset: 0;
        }

        /* Component display area */
        .viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Section visibility */
        .component-section {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .active-section {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Global Cursor Spotlight */
        .cursor-light {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Updated Prisma Styling */
        .prisma-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            width: 100%;
            height: 100%;
        }

        .p-item {
            width: 2px;
            height: 18px;
            background-color: var(--gold);
            opacity: 0;
            transition: opacity 2s ease, transform 2s ease;
        }

        .p-item.active {
            opacity: 1;
            box-shadow: 0 0 10px var(--gold);
            transition: none;
        }
    </style>
</head>
<body>

    <nav class="nav-container">
        <a class="nav-link active-tab" data-target="s-prisma">Prisma
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M 0 5 L 100 5"></path></svg>
        </a>
        <a class="nav-link" data-target="s-cards">Glow Cards
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M 0 5 L 100 5"></path></svg>
        </a>
        <a class="nav-link" data-target="s-ripple">Ripple
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M 0 5 L 100 5"></path></svg>
        </a>
        <a class="nav-link" data-target="s-more">Upcoming
            <svg class="svg-underline" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M 0 5 L 100 5"></path></svg>
        </a>
    </nav>

    <div class="cursor-light" id="light"></div>

    <div class="viewport">
        <section class="component-section active-section s-prisma">
            <div class="prisma-grid" id="p-grid"></div>
        </section>

        <section class="component-section s-cards">
            <!-- Glow card logic remains same as previous version -->
        </section>
    </div>

    <script>
        const light = document.getElementById('light');
        window.addEventListener('mousemove', e => {
            light.style.opacity = 1;
            light.style.left = e.clientX + 'px';
            light.style.top = e.clientY + 'px';
        });

        // Tab Switching
        const links = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('.component-section');
        links.forEach(link => {
            link.onclick = () => {
                links.forEach(l => l.classList.remove('active-tab'));
                sections.forEach(s => s.classList.remove('active-section'));
                link.classList.add('active-tab');
                document.querySelector('.' + link.dataset.target).classList.add('active-section');
            };
        });

        // Grid Generation
        const grid = document.getElementById('p-grid');
        const items = [];
        for(let i=0; i<600; i++) {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'center';
            const line = document.createElement('div');
            line.className = 'p-item';
            div.appendChild(line);
            grid.appendChild(div);
            items.push({line, div});
        }

        window.onmousemove = e => {
            items.forEach(item => {
                const r = item.div.getBoundingClientRect();
                const dx = e.clientX - (r.left + r.width/2);
                const dy = e.clientY - (r.top + r.height/2);
                const d = Math.sqrt(dx*dx + dy*dy);
                if(d < 100) {
                    const ang = Math.atan2(dy, dx) * (180/Math.PI);
                    item.line.style.transform = `rotate(${ang+90}deg) scaleY(${1 + (100-d)/50})`;
                    item.line.classList.add('active');
                    setTimeout(() => {
                        item.line.classList.remove('active');
                        item.line.style.transform = `rotate(${ang+90}deg) scaleY(1)`;
                    }, 100);
                }
            });
        };
    </script>
</body>
</html>
