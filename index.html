<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numecraft | Component Showcase</title>
    <style>
        :root {
            --bg-color: #0e0d0a;
            --gold: #fcd55b;
            --gold-muted: #d1b87a;
            --glow: rgba(252, 213, 91, 0.4);
            --nav-bg: rgba(26, 24, 18, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- NAVIGATION BAR (Framer Inspired) --- */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 40px;
            border: 1px solid rgba(252, 213, 91, 0.2);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .nav-link {
            position: relative;
            color: var(--gold-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            padding: 5px 0;
        }

        .nav-link:hover {
            color: var(--gold);
        }

        /* SVG Underlink Animation logic */
        .nav-link::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* --- PRISMA SECTION --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #glow-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(35px, 1fr));
            width: 100vw;
            height: 100vh;
            position: absolute;
        }

        .grid-item {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Prism Shape (Styled Line) */
        .prism {
            width: 3px;
            height: 20px;
            background: linear-gradient(to bottom, var(--gold), transparent);
            border-radius: 2px;
            transform: rotate(var(--rotation)) skewX(10deg);
            opacity: 0;
            transition: opacity 2s ease, transform 2s ease;
        }

        .prism.active {
            opacity: 1;
            box-shadow: 0 0 15px var(--gold);
            transition: none; /* Immediate pop */
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-link" onclick="switchTab('Prisma')">Prisma Grid</a>
        <a href="#" class="nav-link" onclick="switchTab('Glow')">Glow Cards</a>
        <a href="#" class="nav-link" onclick="switchTab('Ripple')">Ripple Effect</a>
    </nav>

    <div class="viewport" id="main-viewport">
        <div id="glow-circle"></div>
        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const glow = document.getElementById('glow-circle');
        const squareSize = 35;
        const cols = Math.ceil(window.innerWidth / squareSize);
        const rows = Math.ceil(window.innerHeight / squareSize);
        const total = cols * rows;
        const prisms = [];

        // Generate Grid
        for (let i = 0; i < total; i++) {
            const wrap = document.createElement('div');
            wrap.classList.add('grid-item');
            
            const prism = document.createElement('div');
            prism.classList.add('prism');
            
            // Random initial rotation for variety
            prism.style.setProperty('--rotation', `${Math.random() * 360}deg`);

            wrap.appendChild(prism);
            grid.appendChild(wrap);
            prisms.push({ el: prism, wrap: wrap, x: 0, y: 0 });
        }

        // Cache positions for smooth performance
        function layout() {
            prisms.forEach(p => {
                const r = p.wrap.getBoundingClientRect();
                p.x = r.left + r.width / 2;
                p.y = r.top + r.height / 2;
            });
        }
        window.addEventListener('resize', layout);
        layout();

        // Mouse Logic
        window.addEventListener('mousemove', e => {
            glow.style.opacity = "1";
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;

            const radius = 100;

            prisms.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < radius) {
                    // Point toward cursor
                    const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    p.el.style.setProperty('--rotation', `${angle + 90}deg`);
                    p.el.classList.add('active');

                    setTimeout(() => {
                        p.el.classList.remove('active');
                    }, 50);
                }
            });
        });

        function switchTab(name) {
            console.log("Switching to: " + name);
            // In a real site, this would swap the grid for Glow Cards or Ripples
        }
    </script>
</body>
</html>
